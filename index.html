<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Page</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Login</h1>

    <form>

        <div class="input-group">

            <label for="email">Email Address</label>

            <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required>

        </div>

        <div class="input-group">

            <label for="password">Password</label>

            <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required>

        </div>

        <div class="forgot">

            <a href="#">Forgot Password?</a>

        </div>

        <div class="remember">

            <input
            type="checkbox"
            id="remember">

            <label for="remember">
                Remember me
            </label>

        </div>

        <button type="submit">

            Login

        </button>

        <p class="register">

            Don't have an account?

            <a href="#">Register</a>

        </p>

    </form>

</div>

</body>

</html>
